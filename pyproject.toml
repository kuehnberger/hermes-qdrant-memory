[project]
name = "hermes-plugin-qdrant"
version = "0.1.0"
description = "Self-hostable Qdrant vector-memory backend for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent community" }]
keywords = ["hermes", "qdrant", "memory", "vector-search", "plugin"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]

# The sole dependency authority for this plugin. plugin.yaml's
# python_dependencies mirrors these for documentation — core parses the manifest
# but never auto-installs from it, so this file is what resolves the environment.
dependencies = [
    # 1.10.0 is the oldest floor with query_points + Prefetch + FusionQuery;
    # the upper bound is the next major. A newest-release floor (e.g. >=1.14)
    # would exclude working older servers for no reason.
    "qdrant-client>=1.10.0,<2",
    # Both embedder backends ship. fastembed (ONNX Runtime, CPU-only) is the
    # default: measured 227 MB peak RSS against sentence-transformers'
    # 2,191 MB, and 0.85 s vs 18.24 s to first embed. sentence-transformers
    # remains a first-class, configurable option because it is materially
    # faster on a machine with a GPU. The plugin only calls
    # SentenceTransformer(...).encode(...), stable since 2.x.
    "fastembed>=0.4.0",
    "sentence-transformers>=2.7.0,<7",
    # torch is intentionally NOT declared: it is transitive via
    # sentence-transformers, and pinning a second constraint on that ~800 MB
    # dependency is not ours to own.
]

[dependency-groups]
dev = ["pytest>=8.0,<10"]

# This is a directory plugin, not an importable distribution — Hermes loads it
# by directory path from $HERMES_HOME/plugins/qdrant/, so there is nothing to
# build or install into site-packages. `package = false` makes `uv sync` install
# dependencies only.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "allow_real_home_io: needs a real Qdrant server / real filesystem; see the live_qdrant fixture",
]
