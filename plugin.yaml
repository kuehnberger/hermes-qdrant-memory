name: qdrant                      # MUST equal the catalog key
version: "0.1.5"                  # quoted — structural validator requires 1-32 chars, and
                                  # the string form avoids the 0.1 -> 0.1 float trap
manifest_version: 2               # v2 fields: python_dependencies, config_schema
kind: exclusive                   # one active provider, selected via memory.provider
author: "Hermes Agent community"
license: MIT
homepage: "https://github.com/kuehnberger/hermes-qdrant-memory"
tags: [memory, qdrant, vector, self-hosted]
description: "Self-hostable Qdrant vector-memory backend for Hermes — semantic search over a local Qdrant server, session-scoped recall, no API key, no vendor account, no lock-in: a 24-42 MB Qdrant server on localhost. Registers qdrant_search / qdrant_upsert / qdrant_recall / qdrant_collect / qdrant_prepare. Embedding is local and on-device (fastembed by default, ~290 MB RSS, no torch required; sentence-transformers selectable for GPU hosts) and downloads model weights from Hugging Face on first use — all memory data stays in your Qdrant server and nothing is sent to a third party. Local embedded mode is not supported; hybrid dense+sparse RRF search and INT8 quantization are not implemented."

requires_hermes: ">=0.21.4"       # parses under _VERSION_COMPARATOR_RE

# NOT pip_dependencies — that key is silently dropped by parse_manifest_file().
# BOTH embedder backends are declared, not just the default. 'fastembed' (ONNX
# Runtime, CPU-only) is the default because it measured 287 MB peak RSS against
# sentence-transformers' 2,191 MB; 'sentence-transformers' stays a supported,
# configurable option for machines with a GPU or RAM to spare. torch itself is
# deliberately NOT declared: it is transitive via sentence-transformers, and
# ~5.3 GB in a CUDA build is not ours to pin. Keep torch in a dev venv — the
# backend-parity tests need it; a runtime venv may drop it entirely.
# 1.10.0 is the oldest floor with query_points + Prefetch + FusionQuery.
python_dependencies:
  - "qdrant-client>=1.10.0,<2"
  - "fastembed>=0.4.0,<1"
  - "sentence-transformers>=2.7.0,<7"

requires_env: []                  # a LOCAL default means no env gate
optional_env:
  - QDRANT_URL
  - QDRANT_API_KEY

# NOT expose_tools — that key parses to an empty provides_tools list.
provides_tools:
  - qdrant_search
  - qdrant_upsert
  - qdrant_recall
  - qdrant_collect
  - qdrant_prepare
  - qdrant_forget
provides_hooks: []

# No config_fields: — not a manifest key; it is dropped with a warning. The schema
# lives in get_config_schema() (read by `hermes memory setup` and the dashboard).
# No config_schema:, no desktop/plugin.js, no update_url.
